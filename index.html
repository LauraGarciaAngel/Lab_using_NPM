<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador APOD · Foto astronómica del día</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <header>
        <h1>Explorador APOD</h1>
        <p>La foto astronómica del día de la NASA</p>
    </header>

    <main class="container my-4">
        <div class="row g-4">
            <section class="col-12 col-lg-8">
                <form id="form-buscar" class="mb-4">
                    <label for="input-fecha" class="form-label">Elige una fecha</label>
                    <input type="date" id="input-fecha" class="form-control" min="1995-06-16">
                    <button type="button" id="btn-buscar" class="btn-primary">Buscar</button>
                </form>

                <div id="mensaje" role="alert alert-danger" role="alert" hidden></div>

                <!-- Indicador de carga con Spinner de Bootstrap -->
                <div id="cargando" class="text-center my-4" hidden>
                    <div class="spinner-border text-danger" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                    <p class="mt-2">Cargando datos de la NASA…</p>
                </div>

                <article id="apod" hidden>
                    <h2 id="apod-titulo"></h2>
                    <p id="apod-fecha"></p>
                    <img id="apod-imagen" class="img-fluid rounded mb-3" src="" alt="">
                    <a id="apod-video" href="#" target="_blank" rel="noopener" hidden>Ver el video en NASA</a>
                    <div id="apod-explicacion"></div>
                    <button type="button" class="btn-primary">⭐ Guardar en favoritos</button>
                </article>
            </section>
            <aside class="col-12 col-lg-4">
                <h2>Favoritos</h2>
                <p id="favoritos-vacio">Aún no has guardado ningún favorito.</p>
                <ul id="lista-favoritos" class="list-group"></ul>
            </aside>
        </div>
    </main>

    <footer>
        <small>Datos: NASA Astronomy Picture of the Day</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="node_modules/dayjs/dayjs.min.js"></script>
    <script src="node_modules/dayjs/locale/es.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
