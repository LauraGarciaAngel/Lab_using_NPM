<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador APOD · Foto astronómica del día</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Explorador APOD</h1>
        <p>La foto astronómica del día de la NASA</p>
    </header>

    <main>
        <section>
            <form id="form-buscar">
                <label for="input-fecha">Elige una fecha</label>
                <input type="date" id="input-fecha" min="1995-06-16">
                <button type="button" id="btn-buscar">Buscar</button>
            </form>

            <div id="mensaje" role="alert" hidden></div>

            <p id="cargando" hidden>Cargando…</p>

            <article id="apod" hidden>
                <h2 id="apod-titulo"></h2>
                <p id="apod-fecha"></p>

                <img id="apod-imagen" src="" alt="">

                <a id="apod-video" href="#" target="_blank" rel="noopener" hidden>Ver el video en NASA</a>

                <div id="apod-explicacion"></div>

                <button type="button" id="btn-favorito">⭐ Guardar en favoritos</button>
            </article>
        </section>

        <aside>
            <h2>Favoritos</h2>
            <p id="favoritos-vacio">Aún no has guardado ningún favorito.</p>
            <ul id="lista-favoritos"></ul>
        </aside>
    </main>

    <footer>
        <small>Datos: NASA Astronomy Picture of the Day</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="node_modules/dayjs/dayjs.min.js"></script>
    <script src="node_modules/dayjs/locale/es.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
